<!DOCTYPE html>
<html>

<head>
    <title>Insurance Claims</title>
</head>

<body>

<h2>Insurance Claims</h2>

<hr>

<p>

<a href="{% url 'patient_new_claim' %}">
Apply New Claim
</a>

</p>

<p>

<a href="{% url 'my_insurance_claims' %}">

View My Claims

</a>

</p>

<br>

{% if claim.remarks %}

    <div class="alert alert-info mt-3">

        <strong>
            Insurance Company Remarks:
        </strong>

        <p class="mb-0 mt-2">
            {{ claim.remarks }}
        </p>

    </div>

{% else %}

    <p class="text-muted">
        No remarks from insurance company yet.
    </p>

{% endif %}

<a href="{% url 'patient_dashboard' %}">

Back to Dashboard

</a>

</body>

</html>
