{% extends 'billing/base.html' %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Billing Staff Profile</h3>

</div>

<div class="card-body">

<table class="table">

<tr>

<th>Name</th>

<td>{{ user.first_name }} {{ user.last_name }}</td>

</tr>

<tr>

<th>Username</th>

<td>{{ user.username }}</td>

</tr>

<tr>

<th>Email</th>

<td>{{ user.email }}</td>

</tr>

<tr>

<th>Role</th>

<td>Billing Staff</td>

</tr>

<tr>

<th>Last Login</th>

<td>{{ user.last_login }}</td>

</tr>

</table>

</div>

</div>

{% endblock %}
