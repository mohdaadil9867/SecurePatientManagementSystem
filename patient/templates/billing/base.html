{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>{% block title %}Billing Portal{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'billing/css/style.css' %}">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar bg-primary text-white p-3">

        <h3 class="text-center mb-4">
            Billing Staff
        </h3>

        <a href="{% url 'billing_dashboard' %}" class="d-block text-white mb-3">
            <i class="fas fa-home"></i>
            Dashboard
        </a>

        <a href="{% url 'billing_list' %}" class="d-block text-white mb-3">
            <i class="fas fa-file-invoice"></i>
            View Bills
        </a>

        <a href="{% url 'create_bill' %}" class="d-block text-white mb-3">
            <i class="fas fa-plus-circle"></i>
            Create Bill
        </a>

        <a href="{% url 'billing_logout' %}" class="d-block text-white mt-5">
            <i class="fas fa-sign-out-alt"></i>
            Logout
        </a>

    </div>

    <!-- Main Content -->

    <div class="content flex-grow-1">

        <!-- Navbar -->

        <nav class="navbar navbar-light bg-light shadow-sm">

            <div class="container-fluid">

                <span class="navbar-brand">

                    Secure Patient System

                </span>

                <span>

                    Welcome,
                    <strong>{{ request.user.username }}</strong>

                </span>

            </div>

        </nav>

        <div class="container-fluid mt-4">

<div class="row">

<div class="col-lg-2">

Sidebar

</div>

<div class="col-lg-10">

{% block content %}

{% endblock %}

</div>

</div>

</div>

    </div>
    <div class="list-group">

<a href="{% url 'billing_dashboard' %}" class="list-group-item">

🏠 Dashboard

</a>

<a href="{% url 'billing_list' %}" class="list-group-item">

📄 View Bills

</a>

<a href="{% url 'create_bill' %}" class="list-group-item">

➕ Create Bill

</a>

<a href="{% url 'billing_profile' %}" class="list-group-item">

👤 Profile

</a>

<a href="{% url 'billing_logout' %}" class="list-group-item text-danger">

🚪 Logout

</a>

</div>

</div>

</body>
</html>
