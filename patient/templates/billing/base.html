
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
        Billing Portal
        {% endblock %}
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #f4f8fb,
                    #eaf2f7
                );

            min-height: 100vh;

        }


        /* =========================
           BILLING NAVBAR
        ========================= */

        .billing-navbar {

            background: #0B203B;

            min-height: 65px;

            padding: 0 25px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.12);

        }


        /* =========================
           BRAND
        ========================= */

        .billing-brand {

            color: white;

            text-decoration: none;

            font-size: 20px;

            font-weight: 700;

            display: flex;

            align-items: center;

            gap: 10px;

        }


        .billing-brand i {

            color: #0D6EFD;

            font-size: 24px;

        }


        .billing-brand:hover {

            color: white;

        }


        /* =========================
           NAV RIGHT
        ========================= */

        .billing-nav-right {

            display: flex;

            align-items: center;

            gap: 15px;

        }


        /* =========================
           BILLING PROFILE LINK
        ========================= */

        .billing-user {

            color: #dbe7f5;

            font-size: 14px;

            text-decoration: none;

            display: inline-flex;

            align-items: center;

            gap: 6px;

            padding: 8px 10px;

            border-radius: 7px;

            transition: 0.2s;

        }


        .billing-user:hover {

            background: rgba(255, 255, 255, 0.10);

            color: white;

        }


        .billing-user i {

            font-size: 17px;

        }


        /* =========================
           LOGOUT BUTTON
        ========================= */

        .logout-btn {

            display: inline-flex;

            align-items: center;

            gap: 7px;

            background: #dc3545;

            color: white;

            text-decoration: none;

            border: none;

            padding: 9px 16px;

            border-radius: 7px;

            font-size: 14px;

            font-weight: 600;

            transition: 0.2s;

        }


        .logout-btn:hover {

            background: #bb2d3b;

            color: white;

            transform: translateY(-1px);

        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .billing-content {

            padding: 30px;

        }


        /* =========================
           LOGIN PAGE
        ========================= */

        .billing-login-page {

            min-height: 100vh;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {

            width: 100%;

            max-width: 430px;

            background: white;

            border-radius: 16px;

            padding: 35px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.12);

        }


        /* =========================
           LOGIN HEADER
        ========================= */

        .login-header {

            text-align: center;

            margin-bottom: 30px;

        }


        .login-icon {

            width: 65px;

            height: 65px;

            margin: 0 auto 15px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #198754;

            color: white;

            font-size: 28px;

        }


        .login-header h2 {

            margin-bottom: 5px;

            font-weight: 700;

            color: #172b4d;

        }


        .login-header p {

            margin: 0;

            color: #6c757d;

            font-size: 14px;

        }


        /* =========================
           FORM
        ========================= */

        .form-label {

            font-weight: 600;

            color: #344054;

        }


        .input-group-text {

            background: #f8fafc;

            border-color: #d9e1e8;

            color: #198754;

        }


        .form-control {

            height: 46px;

            border-color: #d9e1e8;

        }


        .form-control:focus {

            border-color: #198754;

            box-shadow:
                0 0 0 0.2rem
                rgba(25, 135, 84, 0.12);

        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            height: 46px;

            font-size: 16px;

            font-weight: 600;

            border-radius: 8px;

        }


        /* =========================
           FOOTER
        ========================= */

        .login-footer {

            margin-top: 25px;

            text-align: center;

            color: #6c757d;

            font-size: 13px;

        }


        /* =========================
           MOBILE NAVBAR
        ========================= */

        @media (max-width: 576px) {

            .billing-navbar {

                padding: 0 15px;

            }


            .billing-brand {

                font-size: 16px;

            }


            .billing-brand i {

                font-size: 20px;

            }


            .billing-nav-right {

                gap: 5px;

            }


            .billing-user {

                font-size: 13px;

                padding: 7px;

            }


            .logout-btn {

                padding: 8px 10px;

                font-size: 13px;

            }


            .logout-btn {

                gap: 4px;

            }


            .billing-content {

                padding: 15px;

            }

        }

    </style>

</head>


<body>


    <!-- =================================================
         BILLING NAVBAR
    ================================================== -->

    {% if user.is_authenticated %}

    <nav class="billing-navbar">


        <!-- =========================
             BRAND
        ========================== -->

        <a
            href="{% url 'billing_dashboard' %}"
            class="billing-brand"
        >

            <i class="bi bi-hospital"></i>

            Secure Patient System

        </a>


        <!-- =========================
             RIGHT SIDE
        ========================== -->

        <div class="billing-nav-right">


            <!-- =========================
                 CLICKABLE BILLING PROFILE
            ========================== -->

            <a
                href="{% url 'billing_profile' %}"
                class="billing-user"
                title="View Billing Profile"
            >

                <i class="bi bi-person-circle"></i>

                <span>
                    {{ user.username }}
                </span>

            </a>


            <!-- =========================
                 LOGOUT
            ========================== -->

            <a
                href="{% url 'billing_logout' %}"
                class="logout-btn"
            >

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </div>

    </nav>

    {% endif %}


    <!-- =================================================
         MAIN CONTENT
    ================================================== -->

    <main class="billing-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
