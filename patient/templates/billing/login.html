{% extends "billing/base.html" %}

{% block title %}
Billing Staff Login
{% endblock %}

{% block content %}

<div class="billing-login-page">

    <div class="login-card">

        <!-- Header -->
        <div class="login-header">

            <div class="login-icon">
                <i class="bi bi-receipt-cutoff"></i>
            </div>

            <h2>
                Billing Staff Login
            </h2>

            <p>
                Sign in to manage billing records
            </p>

        </div>


        <!-- Login Form -->
        <form method="POST">

            {% csrf_token %}

            {% if error %}

                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-circle"></i>
                    {{ error }}
                </div>

            {% endif %}


            <!-- Username -->
            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        required
                    >

                </div>

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        required
                    >

                </div>

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="btn btn-success w-100 login-btn"
            >

                <i class="bi bi-box-arrow-in-right"></i>

                Login

            </button>

        </form>

    </div>


    <!-- Footer -->
    <div class="login-footer">

        © 2026 Secure Patient Data & Insurance Management System

    </div>

</div>

{% endblock %}
