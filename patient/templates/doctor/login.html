
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Doctor Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        .login-card {
            width: 380px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .login-header {
            background: #198754;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .login-body {
            padding: 25px;
        }

        .form-control {
            height: 45px;
        }

        .login-btn {
            background: #198754;
            border: none;
            height: 45px;
            width: 100%;
        }

        .login-btn:hover {
            background: #157347;
        }

        .doctor-icon {
            font-size: 45px;
            color: #198754;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }

    </style>

</head>

<body>


<div class="login-card">


    <div class="login-header">

        <i class="bi bi-heart-pulse-fill"
           style="font-size:35px;">
        </i>

        <h3 class="mb-0">
            Doctor Login
        </h3>

    </div>


    <div class="login-body">


        {% if error %}

        <div class="alert alert-danger">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="btn btn-success login-btn">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login

            </button>

        </form>


    </div>

</div>

</body>

</html>
