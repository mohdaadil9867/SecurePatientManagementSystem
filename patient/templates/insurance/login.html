<!DOCTYPE html>
<html>

<head>

    <title>Insurance Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

body{

    background:linear-gradient(135deg,#0d6efd,#00c6ff);

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

}

.login-card{

    width:430px;

    background:white;

    border-radius:20px;

    padding:40px;

    box-shadow:0px 15px 35px rgba(0,0,0,.25);

}

.logo{

    font-size:60px;

    color:#0d6efd;

}

.btn-login{

    width:100%;

    border-radius:10px;

    padding:12px;

    font-size:18px;

}

.input-group-text{

    background:#0d6efd;

    color:white;

}

    </style>

</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">

        <i class="bi bi-shield-check logo"></i>

        <h3 class="mt-3">

            Insurance Portal

        </h3>

        <p class="text-muted">

            Secure Patient Data & Insurance Management System

        </p>

    </div>

    {% if error %}

    <div class="alert alert-danger">

        {{ error }}

    </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">

                Username

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person-fill"></i>

                </span>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

        </div>

        <div class="mb-4">

            <label class="form-label">

                Password

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock-fill"></i>

                </span>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    required>

                <button
                    class="btn btn-outline-secondary"
                    type="button"
                    onclick="togglePassword()">

                    <i id="eye" class="bi bi-eye"></i>

                </button>

            </div>

        </div>

        <button
            class="btn btn-primary btn-login">

            Login

        </button>

    </form>

</div>

<script>

function togglePassword(){

let password=document.getElementById("password");

let eye=document.getElementById("eye");

if(password.type==="password"){

password.type="text";

eye.className="bi bi-eye-slash";

}

else{

password.type="password";

eye.className="bi bi-eye";

}

}

</script>

</body>

</html>
