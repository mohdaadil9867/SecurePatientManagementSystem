{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Insurance Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #0b5ed7,
                    #00b4d8
                );

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

        }


        .login-container {

            width: 100%;

            max-width: 440px;

            padding: 20px;

        }


        .login-card {

            background: white;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 20px 50px
                rgba(0,0,0,0.25);

        }


        .logo-circle {

            width: 80px;

            height: 80px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background:
                rgba(13,110,253,0.1);

            color: #0d6efd;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 42px;

        }


        .login-title {

            font-size: 27px;

            font-weight: 700;

            text-align: center;

            margin-bottom: 5px;

        }


        .login-subtitle {

            text-align: center;

            color: #6c757d;

            font-size: 14px;

            margin-bottom: 30px;

        }


        .form-label {

            font-weight: 600;

        }


        .input-group-text {

            width: 45px;

            justify-content: center;

            background: #f1f5f9;

            border-right: none;

        }


        .form-control {

            height: 48px;

            border-left: none;

        }


        .form-control:focus {

            box-shadow: none;

            border-color: #0d6efd;

        }


        .input-group:focus-within
        .input-group-text {

            border-color: #0d6efd;

            color: #0d6efd;

        }


        .login-btn {

            width: 100%;

            height: 50px;

            border-radius: 9px;

            font-size: 16px;

            font-weight: 600;

            margin-top: 10px;

        }


        .security-note {

            margin-top: 25px;

            padding: 12px;

            border-radius: 8px;

            background: #f8f9fa;

            text-align: center;

            font-size: 12px;

            color: #6c757d;

        }


        .security-note i {

            color: #198754;

            margin-right: 5px;

        }


        @media(max-width: 500px) {

            .login-card {

                padding: 30px 22px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <!-- LOGO -->

        <div class="logo-circle">

            <i class="bi bi-shield-check"></i>

        </div>


        <!-- TITLE -->

        <h1 class="login-title">

            Insurance Portal

        </h1>


        <p class="login-subtitle">

            Secure Patient Data & Insurance Management System

        </p>


        <!-- ERROR -->

        {% if error %}

        <div class="alert alert-danger">

            <i class="bi bi-exclamation-triangle"></i>

            {{ error }}

        </div>

        {% endif %}


        <!-- LOGIN FORM -->

        <form method="POST">

            {% csrf_token %}


            <!-- USERNAME -->

            <div class="mb-3">

                <label class="form-label">

                    Username

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>


                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                        autocomplete="username"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="mb-4">

                <label class="form-label">

                    Password

                </label>


                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>


                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        onclick="togglePassword()">

                        <i
                            id="eye"
                            class="bi bi-eye">
                        </i>

                    </button>

                </div>

            </div>


            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="btn btn-primary login-btn">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login

            </button>

        </form>


        <!-- SECURITY -->

        <div class="security-note">

            <i class="bi bi-shield-lock"></i>

            Your login information is securely protected.

        </div>


    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    const eye =
        document.getElementById("eye");


    if (password.type === "password") {

        password.type = "text";

        eye.className =
            "bi bi-eye-slash";

    }

    else {

        password.type = "password";

        eye.className =
            "bi bi-eye";

    }

}

</script>


</body>

</html>
