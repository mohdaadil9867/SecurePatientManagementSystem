{% extends "insurance/base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow-sm border-0">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">

                    <i class="bi bi-key"></i>

                    Change Password

                </h5>

            </div>


            <div class="card-body">

                {% if messages %}

                    {% for message in messages %}

                        <div class="alert alert-{{ message.tags }}">

                            {{ message }}

                        </div>

                    {% endfor %}

                {% endif %}


                {% if error %}

                    <div class="alert alert-danger">

                        {{ error }}

                    </div>

                {% endif %}


                <form method="POST">

                    {% csrf_token %}


                    <div class="mb-3">

                        <label class="form-label">
                            Current Password
                        </label>

                        <input
                            type="password"
                            name="old_password"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            name="new_password"
                            class="form-control"
                            required>

                    </div>


                    <div class="mb-4">

                        <label class="form-label">
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        <i class="bi bi-check-circle"></i>

                        Change Password

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
