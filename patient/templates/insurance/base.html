{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>
        Insurance Portal
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .sidebar{

            width:250px;
            height:100vh;

            position:fixed;

            background:#0d6efd;

            color:white;
        }

        .sidebar a{

            color:white;

            text-decoration:none;

            display:block;

            padding:14px 20px;
        }

        .sidebar a:hover{

            background:#084298;
        }

        .content{

            margin-left:250px;

            padding:30px;
        }

        .logo{

            font-size:22px;

            font-weight:bold;

            text-align:center;

            padding:25px;
        }

    </style>

</head>

<body>

<div class="sidebar">

<div class="logo">

Insurance Portal

</div>

<a href="{% url 'insurance_dashboard' %}">

<i class="bi bi-speedometer2"></i>

Dashboard

</a>

<a href="{% url 'insurance_claim_list' %}">

<i class="bi bi-file-earmark-medical"></i>

Insurance Claims

</a>

<a href="#">
    <i class="bi bi-bell"></i>

    Notifications

    {% if notification_count %}
        <span class="badge bg-danger">
            {{ notification_count }}
        </span>
    {% endif %}
</a>

<a href="{% url 'insurance_profile' %}">
    <i class="bi bi-person-circle"></i>
    Profile
</a>
<a href="{% url 'insurance_change_password' %}">
    <i class="bi bi-key"></i>
    Change Password
</a>

<a href="{% url 'insurance_logout' %}">

<i class="bi bi-box-arrow-right"></i>

Logout

</a>

</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
